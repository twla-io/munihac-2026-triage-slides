<h2 id="but-something-bothered-me">But something bothered me</h2>
<ul>
<li>Can this call change shared state?</li>
<li>Can I swap the order of these two calls?</li>
<li>Can I run them in parallel?</li>
</ul>
<p><strong>So I kept reading the implementations.</strong></p>

{

<h2 id="the-haskell-school-of-reasoning">The Haskell School of Reasoning</h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-haskell"><span class="hljs-title">reverse</span> (reverse xs) = xs             <span class="hljs-comment">-- for finite lists</span>
(xs ++ ys) ++ zs = xs ++ (ys ++ zs)   <span class="hljs-comment">-- provable, by induction</span>

(xs ++ ys) ++ zs   <span class="hljs-comment">-- 2 * length xs + length ys steps</span>
<span class="hljs-title">xs</span> ++ (ys ++ zs)   <span class="hljs-comment">-- length xs + length ys steps</span>
</code></pre>
<p><strong>Can I run them in parallel?</strong> The law answers it, not the implementations.</p>

<h2 id="the-line-matchbypriority">The line: <code>matchByPriority</code></h2>
<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-haskell"><span class="hljs-title">matches</span> :: <span class="hljs-type">AvailableSlot</span> -&gt; <span class="hljs-type">TriagedIntakeRequest</span> -&gt; <span class="hljs-type">Bool</span>
<span class="hljs-title">matches</span> slot <span class="hljs-type">TriagedIntakeRequest</span> { healthcareServiceId, priority, doctorRequirement } =
     slot.healthcareServiceId == healthcareServiceId
  &amp;&amp; matchesDoctorRequirement slot doctorRequirement
  &amp;&amp; matchesTime priority slot.start

<span class="hljs-title">matchByPriority</span> :: <span class="hljs-type">AvailableSlot</span> -&gt; [<span class="hljs-type">TriagedIntakeRequest</span>] -&gt; <span class="hljs-type">Maybe</span> <span class="hljs-type">AppointedIntakeRequest</span>
<span class="hljs-title">matchByPriority</span> slot =
  listToMaybe . mapMaybe (matchIntakeRequestToSlot slot) . sortByPriority
</code></pre>
<p><strong>Calling first no longer beats being urgent</strong></p>

<pre is="marp-pre" data-auto-scaling="downscale-only"><code class="language-text">Submitted → Accepted → Appointed → Closed: completed · cancelled · no-show

<li>Rescheduling = a cancellation + a new request</li>
</ul>

<h2 id="weak-parts-strong-types">Weak parts, strong types</h2>
<table>
<thead>
<tr>
<th>Weak part of the practice</th>
<th>Strong model</th>
</tr>
</thead>
<tbody>
<tr>
<td>Free windows worked out by hand</td>
<td><code>DoctorCalendar</code>: no two overlapping entries of the same doctor</td>
</tr>
<tr>
<td>All help competes for the same time</td>
<td><code>HealthcareService</code>: a request only fits slots of its own service</td>
</tr>
<tr>
<td>Dates offered before triage</td>
<td><code>AppointedIntakeRequest</code>: no appointment without its triage decision</td>
</tr>
<tr>
<td>Urgent patients wait too long</td>
<td><code>matchByPriority</code>: a free slot goes to the highest priority that fits</td>
</tr>
</tbody>
</table>

<li>This kind of race is well known: any database textbook describes it</li>

</ul>

<h2 id="the-final-experiment">The final experiment</h2>
<ul>
<li>Deleted every generated layer: schema, persistence, service, API, frontend</li>
<li>A fresh agent regenerated the backend from <code>Domain.hs</code> and the skills alone</li>
<li>Another agent, which never saw the backend, regenerated the UI from the API description</li>
<li>The tests passed. The API was unchanged</li>
<li>Four differences became four new rules</li>
</ul>
<p><strong>The goal: skills that behave like a pure function of <code>Domain.hs</code></strong></p>

</tr>

<li>What nobody thought to test: no test caught the race, only reasoning from a type</li>
