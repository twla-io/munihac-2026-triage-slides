<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- End of restriction: the no-lambda sign, lifted -->
  <defs>
    <clipPath id="disc"><circle cx="100" cy="100" r="88"/></clipPath>
  </defs>
  <circle cx="100" cy="100" r="88" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="4"/>
  <!-- The old symbol, greyed out -->
  <g fill="none" stroke="#A9A9A9" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 66 48 Q 86 44 96 70 L 134 150"/>
    <path d="M 104 92 L 68 150"/>
  </g>
  <!-- Diagonal stripes, upper right to lower left -->
  <g clip-path="url(#disc)" stroke="#292735" stroke-width="4">
    <line x1="160" y1="-20" x2="-20" y2="160"/>
    <line x1="190" y1="-20" x2="-20" y2="190"/>
    <line x1="220" y1="-20" x2="-20" y2="220"/>
    <line x1="250" y1="-20" x2="-20" y2="250"/>
    <line x1="280" y1="-20" x2="-20" y2="280"/>
  </g>
</svg>
