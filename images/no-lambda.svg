<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Prohibition sign: no lambdas allowed -->
  <circle cx="100" cy="100" r="84" fill="#FFFFFF" stroke="#C8102E" stroke-width="18"/>
  <!-- Lambda -->
  <g fill="none" stroke="#292735" stroke-width="15" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 66 48 Q 86 44 96 70 L 134 150"/>
    <path d="M 104 92 L 68 150"/>
  </g>
  <!-- Bar, drawn over the lambda -->
  <line x1="41" y1="41" x2="159" y2="159" stroke="#C8102E" stroke-width="18"/>
</svg>
